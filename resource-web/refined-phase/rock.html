<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Precious Stones: Refined Webpage | Rock Details</title>
        <link rel="stylesheet" href="phaseIV.css"> <!--link to main css for all global information-->
        <link rel="stylesheet" href="rock.css"> <!--separate css file for info pages to keep things organized and not crowd up my main css-->
        <link rel="icon" type="image/png" href="../images/covers/favicon.png"> <!--favicon for the webpage-->
    </head>

    <body>
        <header class>
            <div class="navbar">
                <a href="index.html" class="logo">
                    <img src="../images/logo.png" alt="My Precious Stones home page logo; an illustration of a rock named 'Yarn Ball'.">
                </a>
                <nav class="navigation">
                    <a href="about.html">about</a>
                    <!--<a href="textures.html">textures</a>-->
                </nav>
            </div>
            <div class="nav-div"></div>
        </header>
        <main>
            <div class="image-container">
                <img id="rock-image" src="" alt="">
                <a href="index.html" class="back">×</a>
                <div class="image-div"></div>
            </div>
            <h1 id="rock-title"></h1>
            <section class="rock-information">
                <div class="specimen-data">
                    <h3>classification & type</h3>
                    <ul id="class"></ul>
                    <h3>size & shape</h3>
                    <ul id="ss"></ul>
                    <h3>colour</h3> 
                    <ul id="col"></ul>
                    <h3>surface texture</h3> 
                    <ul id="tex"></ul>
                </div>
                <div class="personal-details">
                    <div id="anecdote"></div>
                    <p id="locTime"></p>
                    <div class="p-div"></div>
                </div>
            </section>
        </main>
        <footer class="footer">
            <div class="footer-div"></div>
            <p class="main-footer">A project from Melissa Andrade.</p>
            <a href="index.html" class="project-name">My Precious Stones | 2026</a>
        </footer>

        <script src="rock.js"></script>
    </body>
