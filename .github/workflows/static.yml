# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # This creates a perfect copy of your project folder structure 
      # so your "../images" links match up perfectly in the browser
      - name: Prepare layout for deployment
        run: |
          mkdir -p deploy-folder/resource-web
          cp -r resource-web/images deploy-folder/resource-web/images
          cp -r resource-web/fonts deploy-folder/resource-web/fonts
          cp -r resource-web/refined-phase deploy-folder/resource-web/refined-phase
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./resource-web/refined-phase/index.html"></head></html>' > deploy-folder/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Tells GitHub to publish our perfectly structured folder
          path: 'deploy-folder'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
